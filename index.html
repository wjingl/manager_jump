<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!-- Delayed fallback: redirect to whatever URL was baked in at deploy time.
       JS redirect (below) fires first with the dynamically-fetched latest URL. -->
  <meta http-equiv="refresh" content="5; url=https://a565694da17a5b.lhr.life">
  <title>实习管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
    .card { background: #fff; border-radius: 12px; padding: 48px 40px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); max-width: 420px; width: 90%; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .status { font-size: 14px; color: #999; line-height: 1.6; }
    .status a { color: #1677ff; text-decoration: none; word-break: break-all; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #1677ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 16px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .offline .spinner { display: none; }
    .offline .icon::before { content: "\1F634"; }
    .redirecting .icon::before { content: "\1F517"; }
  </style>
</head>
<body class="redirecting">
  <div class="card">
    <div class="icon"></div>
    <h1>实习管理系统</h1>
    <p class="status" id="msg">正在跳转，请稍候...</p>
    <div class="spinner" id="spin"></div>
  </div>
  <script>
    (async function() {
      var msg = document.getElementById('msg');
      var spin = document.getElementById('spin');
      var t = '?t=' + Date.now();
      var url = null;

      // Fetch url.txt from GitHub Pages (same origin, no CORS issue)
      // Note: GitHub Pages caches for ~10 min, so there's a brief delay after tunnel URL changes.
      // The meta-refresh fallback in <head> handles the transition period.
      try {
        var r = await fetch('url.txt' + t);
        if (r.ok) url = (await r.text()).trim();
      } catch (e) {}

      if (url && url.startsWith('http') && url !== 'offline') {
        window.location.href = url;
      } else {
        document.body.className = 'offline';
        msg.innerHTML = '系统当前未启动<br>请稍后再试';
        spin.style.display = 'none';
      }
    })();
  </script>
</body>
</html>
