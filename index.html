<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://full-grapes-drop.loca.lt">
  <title>实习管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; padding: 48px 40px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); max-width: 420px; width: 90%; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #1677ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 16px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 14px; color: #999; line-height: 1.6; }
    .status a { color: #1677ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="font-size:20px;margin-bottom:8px;">实习管理系统</h1>
    <p class="status">正在跳转，请稍候...<br>如未自动跳转，<a href="https://full-grapes-drop.loca.lt">点击这里</a></p>
    <div class="spinner"></div>
  </div>
  <script>window.location.href="https://full-grapes-drop.loca.lt";</script>
  <!-- TUNNEL_URL:https://full-grapes-drop.loca.lt -->
</body>
</html>
